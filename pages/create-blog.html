
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogSpace</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">BlogSpace</div>

    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <main class="create-blog-container">
    <h1>Create a New Blog</h1>
    <p>Share your thoughts and ideas with the world.</p>

    <form id="blogForm">
      <label for="title">Blog Title</label>
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Enter your blog title"
        required
      >

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select a category</option>
        <option value="Technology">Technology</option>
        <option value="Education">Education</option>
        <option value="Lifestyle">Lifestyle</option>
        <option value="Travel">Travel</option>
        <option value="Other">Other</option>
      </select>

      <label for="content">Blog Content</label>
      <textarea
        id="content"
        name="content"
        rows="10"
        placeholder="Write your blog here..."
        required
      ></textarea>

      <button type="submit" class="btn">Publish Blog</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <footer>
    &copy; 2026 BlogSpace. All rights reserved.
  </footer>

  <script>
    const blogForm = document.getElementById("blogForm");
    const message = document.getElementById("message");

    blogForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const content = document.getElementById("content").value.trim();

      if (!title || !category || !content) {
        message.textContent = "Please fill in all fields.";
        return;
      }

      const blogs = JSON.parse(localStorage.getItem("blogs") || "[]");

      const newBlog = {
        id: Date.now(),
        title: title,
        category: category,
        content: content,
        date: new Date().toLocaleDateString()
      };

      blogs.push(newBlog);
      localStorage.setItem("blogs", JSON.stringify(blogs));

      message.textContent = "Blog published successfully!";

      blogForm.reset();

      setTimeout(function () {
        window.location.href = "dashboard.html";
      }, 1000);
    });
  </script>

</body>
</html>
