
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogSpace</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">BlogSpace</div>

    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <main class="create-blog-container">
    <h1>Create a New Blog</h1>
    <p>Share your thoughts and ideas with the world.</p>

    <form id="blogForm">
      <label for="title">Blog Title</label>
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Enter your blog title"
        required
      >

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select a category</option>
        <option value="Technology">Technology</option>
        <option value="Education">Education</option>
        <option value="Lifestyle">Lifestyle</option>
        <option value="Travel">Travel</option>
        <option value="Other">Other</option>
      </select>

      <label for="content">Blog Content</label>
      <textarea
        id="content"
        name="content"
        rows="10"
        placeholder="Write your blog here..."
        required
      ></textarea>

      <button type="submit" class="btn">Publish Blog</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <footer>
    &copy; 2026 BlogSpace. All rights reserved.
  </footer>

  <script>
    
const blogForm = document.getElementById("blogForm");
const message = document.getElementById("message");

blogForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const content = document.getElementById("content").value.trim();

  // Get logged-in user
  const loggedInUser = JSON.parse(
    localStorage.getItem("loggedInUser") || "null"
  );

  if (!loggedInUser) {
    message.style.color = "#dc2626";
    message.textContent = "Please login first!";
    return;
  }

  if (!title || !category || !content) {
    message.style.color = "#dc2626";
    message.textContent = "Please fill in all fields.";
    return;
  }

  try {
    const response = await fetch(
      "http://localhost:5000/api/blogs/create",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          title: title,
          category: category,
          content: content,
          author: loggedInUser.name
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      message.style.color = "#dc2626";
      message.textContent = data.message;
      return;
    }

    message.style.color = "#16a34a";
    message.textContent = "Blog published successfully!";

    blogForm.reset();

    setTimeout(function () {
      window.location.href = "dashboard.html";
    }, 1500);

  } catch (error) {
    message.style.color = "#dc2626";
    message.textContent = "Unable to connect to server!";
    console.error(error);
  }
});

  </script>

</body>
</html>
