
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - BlogSpace</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="page-header">
    <a class="brand" href="../index.html">BlogSpace.</a>
    <a href="dashboard.html">My Dashboard</a>
</header>

<main class="page-content">

    <article class="detail-card" id="blogDetails">
        <p class="empty-message">Loading blog...</p>
    </article>

</main>

<script>
const API = "http://localhost:5000/api";

const blogId = new URLSearchParams(
    window.location.search
).get("id");

function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

async function loadBlogDetails() {

    const container = document.getElementById("blogDetails");

    if (!blogId) {
        container.textContent = "Blog ID is missing.";
        return;
    }

    try {

        const response = await fetch(
            `${API}/blogs/${encodeURIComponent(blogId)}`
        );

        const blog = await response.json();

        if (!response.ok) {
            throw new Error(blog.message);
        }

        container.innerHTML = `

            <span>${escapeHTML(blog.category)}</span>

            <h1>${escapeHTML(blog.title)}</h1>

            <p>
                Written by
                ${escapeHTML(blog.author?.name || "Unknown author")}
            </p>

            <div class="content">
                ${escapeHTML(blog.content)}
            </div>

        `;

    } catch (error) {

        container.textContent = error.message;
    }
}

loadBlogDetails();
</script>

</body>
</html>
