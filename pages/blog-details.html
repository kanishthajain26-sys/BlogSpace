
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Details - BlogSpace</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <nav class="navbar">
    <div class="logo">BlogSpace</div>

    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </nav>

  <main class="dashboard">
    <div id="blogDetails">
      <p>Loading blog...</p>
    </div>

    <a href="dashboard.html" class="btn">Back to Dashboard</a>
  </main>

  <footer>
    &copy; 2026 BlogSpace. All rights reserved.
  </footer>

  <script>
    const blogDetails = document.getElementById("blogDetails");

    // Get blog ID from URL
    const params = new URLSearchParams(window.location.search);
    const blogId = params.get("id");

    async function getBlogDetails() {
      try {
        if (!blogId) {
          throw new Error("Blog ID not found!");
        }

        const response = await fetch(
          "http://localhost:5000/api/blogs/" + blogId
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to load blog");
        }

        const blog = data.blog;

        blogDetails.innerHTML = `
          <article class="blog-card">
            <h1>${escapeHTML(blog.title)}</h1>
            <p>Category: ${escapeHTML(blog.category)}</p>
            <p>Author: ${escapeHTML(blog.author)}</p>
            <p>Published: ${new Date(blog.createdAt).toLocaleDateString()}</p>
            <hr>
            <p class="blog-content">${escapeHTML(blog.content).replace(/\n/g, "<br>")}</p>
          </article>
        `;

      } catch (error) {
        console.error(error);
        blogDetails.textContent = error.message;
      }
    }

    // Prevent blog text from being treated as HTML
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    getBlogDetails();
  </script>

</body>
</html>
